name: rtl-lint

on:
  push:
    paths: ["rtl/**", "sim/**"]
  pull_request:
    paths: ["rtl/**", "sim/**"]

jobs:
  iverilog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Compile & run testbench
        run: |
          iverilog -g2012 -o /tmp/sim.vvp sim/tb_blink.v rtl/example/blink.v
          vvp /tmp/sim.vvp
